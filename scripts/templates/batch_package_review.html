<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>标题与封面 · 集中审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#182c2a;font:16px/1.65 'Microsoft YaHei',system-ui,sans-serif}header,main{max-width:1480px;margin:auto;padding:32px}header{padding-bottom:14px}h1{font-size:34px;line-height:1.4;margin:8px 0}h2{font-size:23px;line-height:1.5;margin:0}h3{font-size:19px;line-height:1.6;margin:14px 0 9px}.muted{color:#65716b;font-size:14px}.eyebrow{font-size:12px;letter-spacing:2px;color:#647569}.toolbar{position:sticky;top:0;background:#f3f1ebf5;backdrop-filter:blur(12px);z-index:3;border-block:1px solid #d4dbd2;padding:14px 32px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button,textarea{font:inherit;border:1px solid #bcc9c1;border-radius:7px;padding:9px 12px;background:#fffef9;color:#203d35}button{cursor:pointer}button.active,.primary{background:#245d4e;color:white;border-color:#245d4e}section{margin:14px 0 55px;scroll-margin-top:100px}.videohead{display:grid;grid-template-columns:1fr 290px;gap:24px;padding:24px;background:#e5e9df;border-radius:12px;margin-bottom:22px}.videohead p{margin:10px 0}.videohead video{width:100%;max-height:330px;background:#172820;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:#fffefb;border:1px solid #d4dbd2;border-radius:10px;padding:15px;min-width:0}.card .tag{display:flex;justify-content:space-between;font-size:13px;color:#52675d;margin-bottom:12px}.images{display:grid;grid-template-columns:1fr .38fr;gap:10px;align-items:start}.images.single{grid-template-columns:1fr}.images img{display:block;width:100%;height:auto;border-radius:5px}.images small{font-size:12px;color:#6d776f}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:14px}.notes{width:100%;height:80px;resize:vertical}.badge{background:#e2eadf;padding:2px 8px;border-radius:20px}a{color:#235d50;text-underline-offset:4px}.foot{font-size:13px;color:#647369;margin-top:16px}.empty{padding:30px;background:white}.summary{font-size:14px;color:#566d61;margin-left:auto}@media(max-width:900px){header,main{padding:20px}.toolbar{padding:12px 20px}.grid{grid-template-columns:1fr}.videohead{grid-template-columns:1fr}.videohead video{max-height:300px}h1{font-size:27px}}
</style>
<header><div class="eyebrow">__BATCH__ · 发布包装第一轮</div><h1>把标题和封面放在一起选</h1><p>6 条带字幕成片，每条 20 组组合。保留原编号 1、2、4、5、6、7；第 3 条已退出本批。</p><p class="muted">横版：原片人物在左，清晰的原房间背景向右延展，无额外虚化，延展区域含补绘。竖版：使用本条原始画面。可以喜欢某组标题、另一组封面，再告诉我怎样搭配。</p></header>
<nav class="toolbar"><select id="videoFilter" aria-label="筛选视频"><option value="all">全部视频</option></select><select id="ratio" aria-label="封面比例"><option value="pair">横竖版一起看</option><option value="16x9">横版 16:9</option><option value="4x3">横版 4:3</option><option value="9x16">竖版 9:16</option><option value="3x4">竖版 3:4</option></select><select id="scope" aria-label="筛选方案"><option value="all">所有方案</option><option value="recommended">先看建议起点</option><option value="liked">只看我喜欢的</option></select><button id="export" class="primary">导出本批反馈</button><span id="count" class="summary"></span></nav>
<main id="main"></main><script type="application/json" id="data">__DATA__</script><script>
const videos=JSON.parse(document.getElementById('data').textContent),key='package-review:'+location.pathname;let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}const vf=document.getElementById('videoFilter'),ratio=document.getElementById('ratio'),scope=document.getElementById('scope'),main=document.getElementById('main');for(const v of videos){let o=document.createElement('option');o.value=v.id;o.textContent='第 '+v.id+' 条 · '+v.title;vf.append(o)}function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function state(v){return saved[v.id]||(saved[v.id]={titles:[],covers:[],note:''})}function render(){main.replaceChildren();let total=0;for(const v of videos){if(vf.value!=='all'&&vf.value!==v.id)continue;let s=state(v),list=v.candidates.filter(c=>scope.value==='all'||scope.value==='recommended'&&c.recommended||scope.value==='liked'&&(s.titles.includes(c.id)||s.covers.includes(c.id)));const section=el('section');section.id='video-'+v.id;const head=el('div','videohead'),intro=el('div');intro.append(el('div','eyebrow','第 '+v.id+' 条 · 20 组'),el('h2','',v.title),el('p','',v.description));const a=el('a','','查看成片文字稿');a.href=v.transcript;a.target='_blank';intro.append(a,el('p','muted','喜欢按钮和备注只保存在当前浏览器。导出后把反馈文件交给我；它们不会自动确认最终选择。'));const note=el('textarea','notes');note.placeholder='这一条的修改意见，或标题、封面混搭要求';note.value=s.note||'';note.oninput=()=>{s.note=note.value;save()};intro.append(note);const video=el('video');video.controls=true;video.preload='none';video.src=v.video;head.append(intro,video);section.append(head);let grid=el('div','grid');for(const c of list){total++;const card=el('article','card'),tag=el('div','tag');tag.append(el('strong','','第 '+v.id+' 条 / 方案 '+c.id),el('span',c.recommended?'badge':'',c.recommended?'建议起点 · '+c.group:c.group));const images=el('div','images'+(ratio.value==='pair'?'':' single'));for(const r of ratio.value==='pair'?['16x9','3x4']:[ratio.value]){const frame=el('div'),a=el('a');a.href=c.images[r];a.target='_blank';const im=el('img');im.src=c.images[r];im.alt='第'+v.id+'条方案'+c.id+'，'+c.cover_lines.join(' / ')+'，'+r;im.loading='lazy';a.append(im);frame.append(a,el('small','',r.replace('x',':')+' · 点击放大'));images.append(frame)}const actions=el('div','actions');for(const [field,label]of [['titles','喜欢这个标题'],['covers','喜欢这张封面']]){const b=el('button',s[field].includes(c.id)?'active':'',(s[field].includes(c.id)?'✓ ':'')+label);b.setAttribute('aria-pressed',s[field].includes(c.id));b.onclick=()=>{s[field]=s[field].includes(c.id)?s[field].filter(x=>x!==c.id):[...s[field],c.id];save();render()};actions.append(b)}card.append(tag,images,el('h3','',c.title),actions);grid.append(card)}section.append(grid);if(!list.length)section.append(el('p','empty','当前筛选下没有方案。'));section.append(el('p','foot','本轮尚未选定。可在聊天中写“第 '+v.id+' 条，标题选 01，封面选 08”，或继续提出修改。'));main.append(section)}document.getElementById('count').textContent=total+' 组组合'}vf.onchange=ratio.onchange=scope.onchange=render;document.getElementById('export').onclick=()=>{const data={batch:'__BATCH__',kind:'package_preferences_not_final_selection',videos:videos.map(v=>({video_number:v.id,job:v.job,package_sha256:v.package_sha256,...state(v)}))};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=el('a');a.href=u;a.download='标题封面集中反馈.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();
</script></html>
